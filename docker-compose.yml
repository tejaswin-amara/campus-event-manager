services:
  db:
    image: mysql:8.0.36
    container_name: campus_events_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQLDATABASE:-campus_events}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_USER: ${MYSQLUSER:-campus_app}
      MYSQL_PASSWORD: ${MYSQLPASSWORD:?MYSQLPASSWORD must be set}
    ports:
      - "127.0.0.1:${MYSQL_LOCAL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      args:
        PORT: ${PORT:-9090}
    container_name: campus_events_app
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PORT:-9090}:${PORT:-9090}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      PORT: ${PORT:-9090}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQLDATABASE:-campus_events}?allowPublicKeyRetrieval=true&useSSL=${MYSQL_USE_SSL:-false}&connectTimeout=10000
      MYSQLUSER: ${MYSQLUSER:-campus_app}
      MYSQLPASSWORD: ${MYSQLPASSWORD:?MYSQLPASSWORD must be set}
      UPLOAD_DIR: /app/uploads
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      DDL_AUTO: validate
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads

volumes:
  db_data:
  app_uploads:
