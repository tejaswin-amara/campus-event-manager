# Test Database Configuration targeting MySQL 8.4 container (127.0.0.1:3307)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:127.0.0.1}:${MYSQLPORT:3307}/${MYSQLDATABASE:campus_events}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000
spring.datasource.username=${MYSQLUSER:campus_app}
spring.datasource.password=${MYSQLPASSWORD:campus_app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.admin-password=test-admin-password
app.upload-dir=target/test-uploads

logging.level.com.tejaswin.campus=INFO
logging.level.org.springframework.security=WARN
